name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Folder
        run: |
          mkdir -p www
          cp -r index.html script.js style.css manifest.json sw.js logo.png logo-192.png logo-512.png www/ 2>/dev/null || true

      - name: Add Android Platform and Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Android App Icon and Splash Screen
        run: |
          mkdir -p resources
          cp logo.png resources/icon.png
          cp splash.png resources/splash.png
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Generate Notification Status-Bar Icon
        # Capacitor scaffolds android/ with its own placeholder notification
        # icon (ic_stat_icon_config_sample) — the plain white square seen in
        # the status bar. Android notification icons must be a white
        # silhouette on transparent (the OS ignores color, using only the
        # alpha channel as a mask), so this derives one from the real logo
        # and overwrites that placeholder at every density.
        run: |
          pip install --quiet pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import os
          src = Image.open("logo.png").convert("RGBA")
          alpha = src.split()[-1]
          silhouette = Image.new("RGBA", src.size, (255, 255, 255, 0))
          silhouette.putalpha(alpha)
          sizes = {"mdpi": 24, "hdpi": 36, "xhdpi": 48, "xxhdpi": 72, "xxxhdpi": 96}
          for density, px in sizes.items():
              folder = f"android/app/src/main/res/drawable-{density}"
              os.makedirs(folder, exist_ok=True)
              silhouette.resize((px, px), Image.LANCZOS).save(f"{folder}/ic_stat_icon_config_sample.png")
          os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
          silhouette.resize((48, 48), Image.LANCZOS).save("android/app/src/main/res/drawable/ic_stat_icon_config_sample.png")
          print("Notification icon generated.")
          PYEOF

      - name: Inject google-services.json
        run: cp google-services.json android/app/

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: class-schedule-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
